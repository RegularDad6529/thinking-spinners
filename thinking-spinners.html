<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thinking Spinners</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #e0e0e0;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .spinner-stage {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 10px;
  }

  .spinner-container {
    position: relative;
    width: min(90vw, 900px);
    height: min(90vh, 900px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .spinner-gif {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    image-rendering: -webkit-optimize-contrast;
    opacity: 0;
    transition: opacity 0.5s ease-in;
  }

  .spinner-gif.active {
    opacity: 1;
  }

  .caption-area {
    margin-top: 20px;
    margin-bottom: 10px;
    text-align: center;
    min-height: 24px;
  }

  .caption {
    font-size: 18px;
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .caption a {
    color: #7799cc;
    text-decoration: none;
    font-weight: 400;
  }

  .caption a:hover {
    text-decoration: underline;
  }

  .fade-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #0a0a0a;
    opacity: 0;
    transition: opacity 0.4s ease-out;
    pointer-events: none;
    z-index: 10;
  }

  .fade-overlay.show {
    opacity: 1;
  }

  .loading {
    color: #555;
    font-size: 14px;
    text-align: center;
    padding: 40px;
  }
</style>
</head>
<body>

<div class="spinner-stage">
  <div class="spinner-container">
    <div class="fade-overlay" id="fade"></div>
    <img class="spinner-gif" id="spinner" alt="">
  </div>
  <div class="caption-area">
    <div class="caption" id="caption"></div>
  </div>
</div>

<script>
// ============================================================
// CONFIG — source of truth for approved spinners
// ============================================================
const SPINNERS_URL = "https://raw.githubusercontent.com/RegularDad6529/thinking-spinners/main/spinners.json";

// Fallback if GitHub is unreachable
const FALLBACK_SPINNERS = [
  {
    url: "https://media0.giphy.com/media/v1.Y2lkPWUwZTFhZTdjd2hhNHlidWI2NnZobW04ejVubnZndzk0eWw3YTZhMjNvNW8zamZ0eiZlcD12MV9naWZzX2dpZklkJmN0PWc/f7GmaQvY615gdcXcpg/giphy.gif",
    title: "Self Doubt",
    author: "@RegularDad",
    profileUrl: "https://6529.io/RegularDad",
    duration: 34000
  }
];

// ============================================================
// ENGINE
// ============================================================
(function() {
  const spinnerImg = document.getElementById('spinner');
  const captionEl = document.getElementById('caption');
  const fade = document.getElementById('fade');

  let spinners = [];
  let currentIndex = 0;
  let playOrder = [];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function renderCaption(s) {
    if (s.author) {
      captionEl.innerHTML = s.title + ' — <a href="' + s.profileUrl + '" target="_blank" rel="noopener">' + s.author + '</a>';
    } else {
      captionEl.textContent = s.title;
    }
  }

  function showSpinner(index) {
    const s = spinners[index];
    currentIndex = index;

    fade.classList.add('show');

    setTimeout(function() {
      spinnerImg.src = s.url;
      spinnerImg.alt = s.title;
      spinnerImg.classList.remove('active');
      renderCaption(s);
      fade.classList.remove('show');
      spinnerImg.classList.add('active');
    }, 400);
  }

  function advance() {
    const pos = playOrder.indexOf(currentIndex);
    const nextPos = (pos + 1) % playOrder.length;
    showSpinner(playOrder[nextPos]);
  }

  function start() {
    if (spinners.length === 0) {
      captionEl.textContent = 'No spinners found.';
      return;
    }

    currentIndex = Math.floor(Math.random() * spinners.length);
    const rest = shuffle(spinners.filter(function(_, i) { return i !== currentIndex; }));
    playOrder = [currentIndex].concat(rest.map(function(s) { return spinners.indexOf(s); }));

    showSpinner(currentIndex);

    function scheduleNext() {
      const current = spinners[currentIndex];
      const dur = current.duration || 30000;
      setTimeout(function() {
        advance();
        scheduleNext();
      }, dur);
    }
    scheduleNext();
  }

  // ============================================================
  // FETCH APPROVED SPINNERS JSON FROM GITHUB
  // ============================================================
  async function fetchSpinners() {
    try {
      const resp = await fetch(SPINNERS_URL, { cache: 'no-cache' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      if (!Array.isArray(data) || data.length === 0) {
        spinners = FALLBACK_SPINNERS;
      } else {
        spinners = data;
      }
      start();
    } catch (err) {
      console.error('Failed to fetch spinners.json:', err);
      spinners = FALLBACK_SPINNERS;
      start();
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fetchSpinners);
  } else {
    fetchSpinners();
  }
})();
</script>

</body>
</html>
